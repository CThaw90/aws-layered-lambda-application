AWSTemplateFormatVersion: 2010-09-09
Description: This template tests deploying a Lambda function with a shared layer

Parameters:
  Auth0SecretKey:
    Description: The Secret key used for Auth0 authentication
    Type: String

Transform:
  - AWS::Serverless-2016-10-31

Resources:
  SharedLibLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: SharedLib
      ContentUri: lib/
      CompatibleRuntimes:
        - python3.10
      Description: Shared Library for Platform Lambda Functions

  AccountBalance:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: AccountBalance
      Description: This function returns the balance of a user account
      Handler: balance.main
      Runtime: python3.10
      CodeUri: account/
      Events:
        ApiTrigger:
          Type: HttpApi
          Properties:
            Auth:
              Authorizer: JwtAuthorizer
            ApiId: !Ref HttpApiEndpoint
            Path: /account/balance
            Method: get
      Layers:
        - !Ref SharedLibLayer

  UserLogin:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: UserLogin
      Description: This function authenticates a user and returns a JWT token
      Environment:
        Variables:
          AUTH0_SECRET_KEY: !Ref Auth0SecretKey
      Handler: login.main
      Runtime: python3.10
      CodeUri: user/
      Events:
        ApiTrigger:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApiEndpoint
            Path: /user/login
            Method: post
      Layers:
        - !Ref SharedLibLayer

  ServerlessDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: serverless-development.theezy.com.
      Name: serverless-development.theezy.com
      Type: A
      AliasTarget:
        DNSName: !GetAtt ServerlessCustomDomain.RegionalDomainName
        HostedZoneId: !GetAtt ServerlessCustomDomain.RegionalHostedZoneId

  ServerlessCustomDomain:
    Description: This is the custom domain name for the Theezy API gateway
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: serverless-development.theezy.com
      DomainNameConfigurations:
        - CertificateArn: arn:aws:acm:us-east-1:175336301165:certificate/591f67f3-369e-4a51-89fb-1442e2d4420e
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  HttpApiEndpoint:
    Description: This endpoint is used to pass requests to the Lambda functions
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: Development
      Auth:
        Authorizers:
          JwtAuthorizer:
            JwtConfiguration:
              Issuer: https://theezy-dev.us.auth0.com/
              Audience:
                - https://theezy-trader-da96c.ondigitalocean.app
            IdentitySource: $request.header.Authorization

  ServerlessPathMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      DomainName: !Ref ServerlessCustomDomain
      ApiId: !Ref HttpApiEndpoint
      Stage: Development